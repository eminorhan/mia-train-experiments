# mixed_local_cloud_data_reads arm 1a: SimMIM from random init on the lmd_ssl_v3 corpus plus the FlyEM optic-lobe
# EM, with the optic lobe read from /nrs. Arm 1b is this file with the other data file (the optic lobe read from
# the public bucket gs://flyem-optic-lobe); `diff` shows nothing else differs.
#
# Template: lmd_ssl_v2 1b_simmim_scratch. Changed: the data files, 100k -> 5k steps (warmup 5k -> 250), a log line
# every 100 steps instead of 1000 (more data-wait readings), validation every 2500 steps, one checkpoint at the end.
experiment_name = "mixed__1a_optic_local"

[model]
name = "dinov3_vit3d"
img_size = 256            # 32^3 = 32,768 tokens at patch 8
patch_size = 8            # 64 nm tokens at 8 nm
in_chans = 1
embed_dim = 1024          # ViT-L
depth = 24
num_heads = 16            # head_dim 64; 64 % 6 = 4, so axial 3D RoPE leaves 4 channels unrotated
n_storage_tokens = 4
layerscale_init = 1.0e-05
mask_k_bias = true
pos_embed_rope_dtype = "fp32"
pos_embed_rope_type = "vanilla"  # axial 3D RoPE
drop_path_rate = 0.0      # drops nothing at one sample per rank
use_fa4 = false           # `[trainer].compile` needs torch SDPA
attn_max_score = 1e5      # the attention-score cap of every DINOv3 config

[algorithm]
name = "simmim"
mask_ratio = 0.9
mask_granularity = 4      # in patches: 32-voxel masked blocks
norm_pix_loss = false

[data]
name = "miao_volumes"
config_path = "/groups/scicompsoft/home/orhane/projects/mia-train-experiments/mixed_local_cloud_data_reads/data/v3_plus_optic_lobe_local.yaml"
# The run draws 40,000 windows, so it never crosses an epoch boundary (each one respawns the loader workers).
samples_per_epoch = 1000000
defer_image_ops = true

[val_data]
# Fresh random crops from the same corpus at every validation: a progress readout, not a held-out set.
name = "miao_volumes"
config_path = "/groups/scicompsoft/home/orhane/projects/mia-train-experiments/mixed_local_cloud_data_reads/data/v3_plus_optic_lobe_local.yaml"
samples_per_epoch = 128
defer_image_ops = true

[trainer]
max_steps = 5000
batch_size = 1            # per rank; x 8 ranks -> global batch 8
lr = 0.0003
warmup_steps = 250
min_lr_ratio = 0.001
weight_decay = 0.05
grad_clip_norm = 1.0
layerwise_lr_decay = 1.0
patch_embed_lr_mult = 1.0
lr_schedule = "linear"
precision = "bf16"
compile = true            # needs TORCHINDUCTOR_LAYOUT_OPTIMIZATION=0 in the job, which submit.sh sets
activation_checkpointing = false
log_every = 100
val_every = 2500
checkpoint_every = 5000
num_workers = 8
seed = 0

[parallelism]
dp_replicate = 1
dp_shard = 8              # one B300 node
tp = 1

[augment]
rotate = "inplane"        # geometric only, as lmd_ssl_v2's SimMIM arms
