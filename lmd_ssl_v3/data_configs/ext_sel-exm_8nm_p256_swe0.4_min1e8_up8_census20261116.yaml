#
# Quarantined by corpus/quarantine.yaml:
#   *-unstitched/*  (266 volumes, PERMANENT — never lifted)
#     Unstitched crops are not a mosaic covering a large area — they are near-duplicate views
#     of the same tissue. Measured from the BigStitcher dataset.xml the tiles carry: all 105
#     tiles of FlyID45 come from one source file and their positions span 625 x 541 x 943 px,
#     while each tile is 4096 x 2560 x 4301. Every one of the 5460 tile pairs overlaps, median
#     87%. Their union bounding box is 76.8 G voxels against 4.74 T summed — a redundancy of
#     ~62x. Across all four acquisitions, 14.8 T of apparent data is roughly 0.31 T of
#     distinct tissue, 0.35% of the corpus. Downweighting them does not fix this. A per-volume
#     weight sets how often the group is sampled; it cannot make 87% of any two tiles stop
#     being the same voxels. The correct weight is ~1/62, which makes them a rounding error
#     while still costing 347 volumes of dataloader overhead and heavy read amplification. NOT
#     an argument about resolution. These are 8.72 x 8.72 x 55.56 nm, but the STITCHED
#     mirrorscope volumes (FlyID49) are 4.906 x 4.906 x 31.25 nm — the same 6.4x anisotropy,
#     and also upsampled in z (3.9x) to reach an 8 nm isotropic ladder. Both are kept or
#     dropped on redundancy, not on z sampling; FlyID49 is in the config at ~11% of an epoch.
#     This reverses no earlier decision: no config ever shipped with these. All four
#     pretraining configs predating the recipe rewrite contain zero unstitched volumes, and
#     the last census committed before it (570 stores) had none. The four acquisitions landed
#     on 2026-08-26. What this prevents is them arriving by default — on the first rebuild
#     after they landed they took 266 of 367 volumes, 72% of the config, at 0.35% of the real
#     tissue. The fix is upstream and already possible: the stitching metadata exists, and
#     FlyID49 shows the pipeline emits a stitched product. A stitched FlyID22/41/45 will not
#     match this glob and is picked up automatically on the next census bump. Nothing is
#     permanently lost.
#   */crop-*_deconvolved  (2 volumes, PERMANENT — never lifted)
#     A deconvolved copy of a volume the corpus already holds. The two stores of
#     census-20261116 that match (PPS-261015-002 and rubinlab lobeTm1, each
#     `crop-002_deconvolved`) have the shape of their `crop-001_fullvol` and show the same
#     tissue: at the coarsest pyramid level the two arrays correlate 0.95 and 0.81 voxel for
#     voxel, against 0.28 and 0.15 after a shift of 8 voxels. A config holding both would
#     sample that tissue twice. The originals stay, because they carry the cell labels. This
#     is a choice between two renderings of one specimen, made for lmd_ssl_v3. A deconvolved
#     store with no original beside it needs its own decision: this pattern would drop it too.
#   em-celegans-CellMap-jrc-dauer-larva/crop-*  (0 volumes, paused since 2026-11-16; ask Emin Orhan)
#     A worm in embedding resin, imaged as tiled 70 nm sections. 28-44% of each of the four
#     crops is zero around the tile mosaic, and much of the rest is resin, not worm. A box
#     found from the zeros lands partly or wholly in the resin (seen on the pictures of
#     2026-11-16), so these crops need boxes from a texture-based tissue mask. Only a recipe
#     with a resolution range reaches them at all: 70 nm sections are too coarse for an 8 nm
#     ladder under max_upsample 8. Unboxed, 5 to 34 of 300 crops per store are blank and 138
#     to 239 are more than 10% zero. Paused until they have such boxes. The whole volume they
#     were cut from has them: it is em-celegans-CellMap-jrc-dauer-larva/full in
#     corpus/external.yaml, which this pattern leaves alone, and a config that holds it leaves
#     these crops out as covered.
