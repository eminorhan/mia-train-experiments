# lmd_ssl_v3 data config: Data scaling (1%) (README, "Planned runs"). Derived on 2026-11-18 by
# make_scaled.py (in this folder) from the base config,
#   ext_8nm_p256_swe0.4_min1e8_up8_win1-99_noclip_census20261116.yaml  sha256:ed6cf7f2a3b659e0
# The base's volumes, resolutions, windows and sampling rule, with one change: every entry is held to a
# box that keeps 1% of the region the base draws from (its tissue box, or the whole volume).
#   - The box is centered in that region and has its proportions.
#   - No side is shorter than a patch plus 25% at the entry's resolution. Where a side is held at that
#     minimum the other sides shrink further. An entry whose smallest such box is larger than its 1%
#     keeps that box.
#   - The boxes of a smaller data-scaling config lie inside the boxes of a larger one.
#
# 360 entries, the base's. They hold 3.76 T of the base's 375.2 T level-0 voxels (1.00%).
# 196 entries have a side at the minimum; 136 of them keep more than 1% of their region, 0 keep all of it.
# miao draws an entry in proportion to size ** 0.4, with size measured inside its box. Against the base,
# the draw probabilities move by 3.0% in total, towards the entries that keep more than their share.

# ---------------------------------------------------------------------------
# Global settings.
# ---------------------------------------------------------------------------
size_weighting_exponent: 0.4
resolutions:
- - 8.0
  - 8.0
  - 8.0
patch_size:
- 256
- 256
- 256
output_axes: lcxyz
samples_per_epoch: 1000

