# lmd_ssl_v3 arm 1g, data scaling (10%): arm 1a (1a_base.toml) with every volume held to a box with 10% of its
# region. Only the data config differs.
experiment_name = "lmd3__1g_data10pct"

[model]
name = "dinov3_vit3d"
img_size = 256            # 32^3 = 32,768 tokens at patch 8
patch_size = 8            # 64 nm tokens at 8 nm
in_chans = 1
embed_dim = 1024          # ViT-L
depth = 24
num_heads = 16
n_storage_tokens = 4
layerscale_init = 1.0e-05
mask_k_bias = true
pos_embed_rope_dtype = "fp32"
pos_embed_rope_type = "vanilla"
drop_path_rate = 0.0
use_fa4 = false           # `[trainer].compile` needs torch SDPA
attn_max_score = 1e5

[init]
path = "/groups/miaai/miaai/pretrained_models/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
inflate_2d_to_3d = true
skip = ["rope_embed."]    # the 3D RoPE tables are rebuilt
strict = true

[algorithm]
name = "simmim"
mask_ratio = 0.9
mask_granularity = 4      # in patches: 32-voxel masked blocks
norm_pix_loss = false

[data]
name = "miao_volumes"
config_path = "/groups/scicompsoft/home/orhane/projects/mia-train-experiments/lmd_ssl_v3/data_configs/ext_data10pct_8nm_p256_swe0.4_min1e8_up8_census20261116.yaml"
samples_per_epoch = 1000000
defer_image_ops = true

[val_data]
# Fresh random crops from the same corpus: a progress readout, not a held-out set.
name = "miao_volumes"
config_path = "/groups/scicompsoft/home/orhane/projects/mia-train-experiments/lmd_ssl_v3/data_configs/ext_data10pct_8nm_p256_swe0.4_min1e8_up8_census20261116.yaml"
samples_per_epoch = 128
defer_image_ops = true

[trainer]
max_steps = 250000
batch_size = 4            # per rank; x 8 ranks -> global batch 32
lr = 0.0003
warmup_steps = 5000
min_lr_ratio = 0.001
weight_decay = 0.05
grad_clip_norm = 1.0
layerwise_lr_decay = 1.0
patch_embed_lr_mult = 1.0
lr_schedule = "linear"
precision = "bf16"
compile = true            # needs TORCHINDUCTOR_LAYOUT_OPTIMIZATION=0 in the job
activation_checkpointing = false
log_every = 1000
val_every = 10000
checkpoint_every = 25000
num_workers = 8
seed = 0

[parallelism]
dp_replicate = 1
dp_shard = 8              # one B300 node
tp = 1

[augment]
rotate = "inplane"        # geometric only: SimMIM's target is its input
